# Pi preferences — one declaration, two adapters (see docs/adr/0004).
# `shared` renders into BOTH the host pi settings (dot_pi/agent/settings.json.tmpl)
# and the guest feynman pi declaration (dot_config/feynman/pi-guest-prefs.json.tmpl).
# `hostOnly` and `guest` are consumed by exactly one adapter each.

[piPrefs.shared]
collapseChangelog = true
compaction = { enabled = true }
defaultProjectTrust = "always"
doubleEscapeAction = "tree"
editorPaddingX = 0
enableInstallTelemetry = false
markdown = { mermaid = "final" }
piVim = { modeColors = { insert = "text", normal = "accent" } }
quietStartup = true
showHardwareCursor = true
terminal = { showImages = true }
tuiMode = "fullscreen"

[piPrefs.hostOnly]
defaultThinkingLevel = "high"
enabledModels = ["zai/glm-5.3-flash", "deepseek/deepseek-flash"]
hideThinkingBlock = true
lazyTools = { defer = ["Defer(web_*)", "zai_web_search", "resolve-library-id", "query-docs", "recall", "format_md_tables", "mermaid_lint"], noDefer = [], deferToolLoading = true }
lastChangelogVersion = "0.85.1"
outputPad = 0
oppiMirror = { autoStart = false, workspaceCreation = "never" }
theme = "Monokai Pro (CE)"
packages = [
	"npm:pi-vim",
	"npm:@ff-labs/pi-fff",
	"npm:pi-markdown-preview",
	"npm:@narumitw/pi-btw",
	"npm:pi-zentui",
	"npm:@upstash/context7-pi",
	"npm:@bigboss2063/pi-clip",
	"npm:cc-safety-net",
	"npm:pi-sandbox",
	"npm:pi-extmgr",
	"npm:@estebanforge/pi-glm-tweaks",
	"npm:donsetch",
	"npm:pi-blackhole",
	"npm:pi-context-view",
	"git:github.com/studyzy/pi-lazy-tools",
	"npm:@krfantasy/pi-monokai-pro",
	"npm:pi-compact-transcript",
	"npm:@narumitw/pi-usage"
]
packageDocs = [
	{ "npm:pi-vim" = "https://github.com/lajarre/pi-vim" },
	{ "npm:@ff-labs/pi-fff" = "https://github.com/dmtrKovalenko/fff/tree/main/packages/pi-fff" },
	{ "npm:pi-markdown-preview" = "https://github.com/omaclaren/pi-markdown-preview" },
	{ "npm:@narumitw/pi-btw" = "https://github.com/narumiruna/pi-extensions/tree/main/packages/pi-btw" },
	{ "npm:pi-zentui" = "https://github.com/lmilojevicc/pi-zentui" },
	{ "npm:@upstash/context7-pi" = "https://github.com/upstash/context7" },
	{ "npm:@bigboss2063/pi-clip" = "https://github.com/bigboss2063/pi-clip" },
	{ "npm:cc-safety-net" = "https://github.com/kenryu42/cc-safety-net" },
	{ "npm:pi-sandbox" = "https://github.com/carderne/pi-sandbox" },
	{ "npm:pi-extmgr" = "https://github.com/ayagmar/pi-extmgr" },
	{ "npm:@estebanforge/pi-glm-tweaks" = "https://github.com/EstebanForge/pi-glm-tweaks" },
	{ "npm:donsetch" = "https://github.com/dondai44423/donsetch" },
	{ "npm:pi-blackhole" = "https://github.com/k0valik/pi-blackhole" },
	{ "npm:pi-context-view" = "https://github.com/dimk90/pi-context-view" },
	{ "git:github.com/studyzy/pi-lazy-tools" = "https://github.com/studyzy/pi-lazy-tools" },
	{ "npm:@krfantasy/pi-monokai-pro" = "https://github.com/krfantasy/pi-monokai-pro" },
	{ "npm:pi-compact-transcript" = "https://github.com/avhagedorn/pi-compact-transcript" },
	{ "npm:@narumitw/pi-usage" = "https://github.com/narumiruna/pi-extensions/tree/main/packages/pi-usage"}
]

# Extensions bundled into the feynman sandbox: merged into
# ~/.feynman/agent/settings.json `packages` (feynman's pi home, mounted into
# the VM) and materialized by feynman's pi at startup. Peer-range rule from
# docs/adr/0004 applies: check against the bundled pi.
[piPrefs.guest]
extensions = ["npm:pi-compact-transcript", "npm:pi-vim"]
