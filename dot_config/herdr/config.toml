# Herdr app config — Monokai Pro (CE)
#
# Citation: Monokai — Monokai Pro (CE) for OpenCode, default filter palette [MIT]
# Source: https://github.com/monokai-pro/opencode (monokai-pro.json)
# Accessed: 2026-09-08
# Modified by jennymaeleidig on 2026-09-08 — mapped the Monokai Pro (CE)
# default-filter palette onto Herdr's theme.custom tokens.
#
# No official Monokai Pro theme exists for Herdr, so this qualifies as a
# Community Edition (CE) per https://monokai.pro/contribute: named
# "Monokai Pro (CE)", default filter only, free and open source.
#
# Herdr reads no external theme files; the theme lives here as a full set of
# theme.custom overrides on top of a built-in dark base. Panes themselves are
# colored by the host terminal (ghostty theme "Monokai Pro", see
# docs/adr/0003-themes-are-dependencies.md), so the window stays coherent.

onboarding = false

[ui.sound]
enabled = false

# Every theme.custom token below is overridden, so the base theme only acts as
# a fallback for tokens Herdr may add later. Keep it a dark built-in.
[theme]
name = "catppuccin"

[theme.custom]
# foreground → text
text = "#fcfcfa"

# background → surface0
surface0 = "#2d2a2e"
# bg dimmed 2 → surface_dim
surface_dim = "#19181a"
# bg dimmed 1 → panel_bg and desktop sidebar
panel_bg = "#221f22"
sidebar_bg = "#221f22"
# dimmed 5 → surface1, active row, navigate selection
surface1 = "#403e41"
active_row_bg = "#403e41"
selection_bg = "#403e41"

# dimmed 4 → overlay0 (soft borders)
overlay0 = "#5b595c"
# dimmed 3 → overlay1 (strong borders)
overlay1 = "#727072"
# dimmed 2 → subtext0
subtext0 = "#939293"
# (dimmed 1 #c1c0c0 is unused; Herdr has no token between text and subtext0.)

# constant → accent and mauve
accent = "#ab9df2"
mauve = "#ab9df2"
# keyword → red
red = "#ff6188"
# argument → peach
peach = "#fc9867"
# string → yellow
yellow = "#ffd866"
# function → green
green = "#a9dc76"
# class → blue and teal (Monokai Pro has no teal; blue doubles for it)
blue = "#78dce8"
teal = "#78dce8"

# The agent-name token in the expanded sidebar renders with overlay0 + DIM
# by default (src/client/shell/agent_sidebar.rs, render_agent_row), which is
# near-invisible on the Monokai active_row_bg (#5b595c on #403e41, ~1.6:1).
# Give it subtext0 instead, undimmed and bold, so focused agent rows read.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  [{ token = "agent", fg = "#939293", bold = true, dim = false }],
]
