# Herdr app config
#
# Theme is generated from the active Ghostty theme by the vendored
# herdr-theme-sync plugin (prefix+t, or `herdr plugin action invoke
# herdr-theme-sync sync`): it rewrites [theme.custom] and every sidebar fg below
# from Ghostty's palette, validates with `herdr config check`, then reloads.
# Panes themselves are colored by the host terminal (ghostty theme
# "Monokai Pro", see docs/adr/0003-themes-are-dependencies.md). Because sync
# rewrites this chezmoi-managed file, a later `chezmoi apply` reverts to Source
# state unless the generated values are folded back in.
#
# Plugin source lives in dot_local/share/herdr/ghostty-theme-sync; Ghostty moved
# its config from `config` to `config.ghostty`, and the vendored theme-sync.py
# reads that first (falling back to the old name).

onboarding = false

# alt+1..9 jump straight to tabs 1-9 without the prefix. switch_tab is
# pinned explicitly: a legacy [keys.indexed] entry displaces the default
# prefix+1..9 binding unless keys.switch_tab is also set (then both apply).
[keys]
switch_tab = "prefix+1..9"

[keys.indexed]
tabs = "alt"

# Re-derive herdr's theme from the active ghostty theme.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-sync.sync"
description = "sync herdr theme from ghostty"

[ui.sound]
enabled = false

# Sidebar rows. Built-in tokens (state_icon, workspace, agent) render in herdr's
# own state colors and ignore fg; custom $tokens honor fg exactly, so names and
# per-project colors use $tokens. refresh.sh re-pushes $name/$dir/$panes after
# every herdr restart (the plugin's [[startup]] hook) — sidebar tokens are
# ephemeral server state.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", fg = "#fcfcfa", bold = true }, "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#fcfcfa", bold = true }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "$name", fg = "#fcfcfa", bold = true }],
  [
    { token = "branch", fg = "#a9dc76", bold = true },
    { token = "git_status", fg = "#ffd866", bold = true },
    { token = "$dir", fg = "#78dce8", bold = true },
    { token = "$panes", fg = "#fcfcfa", bold = true },
  ],
]

# Generated from ghostty theme "Monokai Pro" by herdr-theme-sync. panel_bg is
# "reset" so ghostty's background transparency shows through. Re-run the sync
# after changing the ghostty theme instead of editing these by hand.
[theme.custom]
panel_bg = "reset"
# Generated by herdr-theme-sync from ghostty theme "Monokai Pro".
# Edit the ghostty theme, then re-run herdr-theme-sync.
# panel_bg reset lets ghostty's background show; sidebar/row/selection bgs follow.
sidebar_bg = "#262427"
active_row_bg = "#2d2a2e"
selection_bg = "#5b595c"
accent = "#fc9867"
text = "#fcfcfa"
subtext0 = "#fcfcfa"
surface0 = "#373438"
surface1 = "#403d40"
surface_dim = "#333034"
overlay0 = "#757375"
overlay1 = "#9f9e9e"
mauve = "#ab9df2"
green = "#a9dc76"
yellow = "#ffd866"
red = "#ff6188"
blue = "#fc9867"
teal = "#78dce8"
peach = "#e0cc93"
