#   ],
#   [{ token = "agent", fg = "#939293", bold = true, dim = false }],
# ]










[theme.custom]
panel_bg = "#2d2a2e"
sidebar_bg = "#262327"
active_row_bg = "#2d2a2e"
selection_bg = "#5b595c"
surface0 = "#2d2a2e"
surface1 = "#727072"
surface_dim = "#29262a"
overlay0 = "#727072"
overlay1 = "#fcfcfa"
text = "#fcfcfa"
subtext0 = "#fcfcfa"
accent = "#fc9867"
mauve = "#ab9df2"
green = "#a9dc76"
yellow = "#ffd866"
red = "#ff6188"
blue = "#fc9867"
teal = "#78dce8"
peach = "#ff6188"
