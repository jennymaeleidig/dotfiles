# Herdr app config
#
# Theme is managed by the herdr-theme-picker plugin (prefix+t): picking a
# theme rewrites [theme.custom] in this file and reloads automatically.
# Panes themselves are colored by the host terminal (ghostty theme
# "Monokai Pro", see docs/adr/0003-themes-are-dependencies.md); the plugin
# additionally syncs the 16 ANSI cell colors to ghostty live via OSC.
#
# KNOWN BUG (upstream, qintmb/herdr-theme-picker): every pick rewrites
# [theme.custom] with BARE hex ("2d2a2e"), but herdr's parse_color only
# accepts "#rrggbb"/"#rgb"/rgb()/names — anything else logs
# "unknown color, defaulting to cyan" and renders cyan (tab bar, active
# rows, labels). If the UI turns cyan after a pick: re-prefix every value
# below with "#", then `herdr server reload-config`. The picker's preview
# looks right because it renders swatches directly, bypassing the parser.
# Also note the OSC sync keeps recoloring ghostty after herdr closes;
# restart ghostty (or OSC 104/110/111) to reset to its configured theme.

onboarding = false

# alt+1..9 jump straight to tabs 1-9 without the prefix. switch_tab is
# pinned explicitly: a legacy [keys.indexed] entry displaces the default
# prefix+1..9 binding unless keys.switch_tab is also set (then both apply).
[keys]
switch_tab = "prefix+1..9"

[keys.indexed]
tabs = "alt"

# Theme picker popup (plugin action id confirmed via `herdr plugin action list`).
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "pick UI theme"

[ui.sound]
enabled = false

# # Sidebar token overrides: machine/tab/pane/agent all share Herdr's
# # overlay0 + DIM fallback style (render_agent_row / resolved_token_spans),
# # which is unreadable on light-on-dark active rows. The hex is the Monokai
# # Pro subtext gray this config used before the theme picker took over
# # theme.custom; revisit if a picked theme's palette clashes with it.
# [ui.sidebar.agents]
# rows = [
#   [
