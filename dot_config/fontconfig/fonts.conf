<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Ghostty's font-family is shared by both hosts, but fontconfig resolves the
     cask's family under its full name while macOS CoreText accepts the short
     one. Alias instead of branching the terminal config. -->
<fontconfig>
  <alias binding="same">
    <family>CommitMonoNF</family>
    <prefer>
      <family>CommitMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>