# One judge, rendered into every consumer. `dot_pi/agent/tinysubagent.jsonc.tmpl`
# takes `<provider>/<model>` for pi's model registry; `dot_pi/agent/pi-warden/config.json.tmpl`
# takes the backend name or an endpoint object built from the same fields;
# `dot_pi/agent/extensions/judge-classifier.ts.tmpl` re-registers the pi provider
# only when `provider = "typesafe"`, so a custom host can be reached through it.
#
# `provider` names the pi provider the classifier is reached through. `backend`
# names what pi-warden talks to: a registry backend, or anything else, which
# renders an endpoint object from `label`/`host`/`path`/`keyEnv`/`model`.
#
# The judge defaults to the local oMLX System One endpoint: `provider` stays
# "typesafe" (the pi provider whose classifier dispatch speaks the System One
# protocol), `backend` is "omlx", a name outside the registry, so every
# consumer gets an endpoint object, and the judge-classifier extension
# re-registers the `typesafe` provider against the oMLX origin.
#
# The other judges this repo has run are OpenCode's hosted Jev:
# `provider = "opencode"`, `backend = "opencode"`, `model = "jev-1.13"`,
# `host = "https://opencode.ai"`, `path = "/inference/systemone/v1/systemone"`,
# key `OPENCODE_API_KEY`; and TypeSafe's hosted Jev: `provider = "typesafe"`,
# `backend = "typesafe"`, `model = "jev-latest"`,
# `host = "https://api.typesafe.ai"`, key `TYPESAFE_API_KEY`, both from the
# unmanaged ~/.secrets/systemone.env.
[judge]
provider = "typesafe"
backend = "omlx"
model = "decision"
label = "oMLX"
host = "http://localhost:8000"
path = "/v1/systemone"
keyEnv = "OMLX_SYSTEMONE_KEY"
