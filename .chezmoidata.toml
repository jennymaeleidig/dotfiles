# One judge, rendered into every consumer. `dot_pi/agent/tinysubagent.jsonc.tmpl`
# takes `<provider>/<model>` for pi's model registry; `dot_pi/agent/pi-warden/config.json.tmpl`
# takes the backend name or an endpoint object built from the same fields;
# `dot_pi/agent/extensions/judge-classifier.ts.tmpl` re-registers the pi provider
# only when `provider = "typesafe"`, so a custom host can be reached through it.
#
# `provider` names the pi provider the classifier is reached through. `backend`
# names what pi-warden talks to: a registry backend, or anything else, which
# renders an endpoint object from `label`/`host`/`path`/`keyEnv`/`model`.
#
# The judge defaults to the local oMLX System One endpoint: `provider` stays
# "typesafe" (the pi provider whose classifier dispatch speaks the System One
# protocol), `backend` is "omlx", a name outside the registry, so every
# consumer gets an endpoint object, and the judge-classifier extension
# re-registers the `typesafe` provider against the oMLX origin.
#
# The other judges this repo has run are OpenCode's hosted Jev:
# `provider = "opencode"`, `backend = "opencode"`, `model = "jev-1.13"`,
# `host = "https://opencode.ai"`, `path = "/inference/systemone/v1/systemone"`,
# key `OPENCODE_API_KEY`; and TypeSafe's hosted Jev: `provider = "typesafe"`,
# `backend = "typesafe"`, `model = "jev-latest"`,
# `host = "https://api.typesafe.ai"`, key `TYPESAFE_API_KEY`, both from the
# unmanaged ~/.secrets/systemone.env.
[judge]
provider = "typesafe"
backend = "omlx"
model = "decision"
label = "oMLX"
host = "http://localhost:8000"
path = "/v1/systemone"
keyEnv = "OMLX_SYSTEMONE_KEY"

# One chat-model pair per hosting mode, the same way [judge] above is one
# classifier: the `pi` / `pi --online` wrapper renders from these tables, so
# the shell and the data cannot drift apart.
# settings.json's `defaultProvider`/`defaultModel` must stay in sync with
# [chat.local] — they pick the launch-time default when no wrapper intervenes.
#
# `provider` names the pi provider; `model` the model string it registers;
# `host` the origin a reachability probe can use; `label` what the toggle
# prints. Keys come from the unmanaged ~/.secrets/systemone.env (OPENCODE_API_KEY).
[chat.local]
provider = "localllm-omlx"
model = "Inkling-2-Mini-MLX-8bit"
host = "http://localhost:8000"
label = "local oMLX code"

[chat.remote]
provider = "opencode-go"
model = "deepseek-v4.1-flash"
host = "https://opencode.ai"
label = "remote OpenCode deepseek-v4.1-flash"

# The online-mode judge: `pi --online` (and the bare-launch fallback) goes
# full remote — chat models from [chat.remote] above and this judge. How the
# mode reaches tinysubagent and pi-warden, which both read their config once
# at load, is dot_pi/docs/adr/0001-per-launch-judge-mode.md.
#
# Same shape as [judge]: `provider` is the pi provider (pi ships
# `opencode/jev-1.13` as a classifier, keyed by OPENCODE_API_KEY);
# `backend` is a name outside pi-typesafe's registry, so every consumer gets
# an endpoint object. Billing is per input token ($0.042/M); `jev-1.13-free`
# is the zero-cost variant of the same model.
[judge.online]
provider = "opencode"
backend = "opencode-online"
model = "jev-1.13"
label = "OpenCode"
host = "https://opencode.ai"
path = "/inference/systemone/v1/systemone"
keyEnv = "OPENCODE_API_KEY"
