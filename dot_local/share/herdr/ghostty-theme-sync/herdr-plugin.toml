# Vendored plugin: derives herdr's [theme.custom] + sidebar colors from the
# active Ghostty theme, and re-pushes ephemeral sidebar tokens after restarts.
# Code adapted from themuuln/herdr-ghostty-theme-sync (MIT) — see CITATION.cff.
#
# Source state lives here; `herdr plugin link ~/.local/share/herdr/ghostty-theme-sync`
# registers it (run by .chezmoiscripts/run_onchange_link-herdr-plugins.sh.tmpl).

id = "herdr-theme-sync"
name = "Ghostty Theme Sync"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Derive herdr's theme and sidebar colors from the active Ghostty theme, and re-push sidebar tokens"
platforms = ["macos", "linux"]

# sync — read the active Ghostty theme and rewrite herdr's [theme.custom] +
# sidebar token colors to match, then validate, reload, and re-push tokens.
[[actions]]
id = "sync"
title = "Sync herdr theme from Ghostty"
contexts = ["global"]
command = ["python3", "theme-sync.py"]

# refresh — re-push sidebar tokens from the live herdr snapshot. Needed after a
# herdr restart: tokens are ephemeral server state.
[[actions]]
id = "refresh"
title = "Refresh herdr sidebar tokens"
contexts = ["global"]
command = ["bash", "refresh.sh"]

# startup — same refresh, run automatically after every herdr restart.
[[startup]]
command = ["bash", "refresh.sh"]
